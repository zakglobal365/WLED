name: Build ViziVest

on:
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout WLED 16.0.1
        uses: actions/checkout@v4
        with:
          ref: v16.0.1

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Install PlatformIO
        run: pip install -r requirements.txt

      - name: Configure ViziVest
        run: |
          cp usermods/platformio_override.usermods.ini platformio_override.ini
          echo >> platformio_override.ini
          echo "custom_usermods = ViziVest-BLE" >> platformio_override.ini
          cat platformio_override.ini

      - name: Build ESP32 firmware
        run: pio run -e usermods_esp32

      - name: Upload firmware
        uses: actions/upload-artifact@v4
        with:
          name: ViziVest-WLED-16.0.1
          path: build_output/**
